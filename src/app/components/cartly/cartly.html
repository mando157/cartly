<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="assets/images/logo.jpg" class="img-fluid" alt="logo">
            <h4 class="fw-bold">Cartly</h4>
        </a>

        <label class="switch">
            <input class="cb" type="checkbox" />
            <span class="toggle" (click)="toggleTheme()">
                <span class="left"><i class="fa-regular fa-sun"></i></span>
                <span class="right"><i class="fa-regular fa-moon"></i></span>
            </span>
        </label>
    </div>
</nav>

<div class="content">
    <div class="container">
        <div class="results">
            <div class="box total-items"><h4>Total Items</h4><span>{{0}}</span></div>
            <div class="box total-price"><h4>Total Price</h4><span>{{0}}$</span></div>
        </div>
        <div class="swiper mb-5">
            <div class="swiper-wrapper">
                @for (product of products; track $index) {
                <div class="swiper-slide">
                    <div class="card" style="width: 18rem;">
                        <div class="image">
                            <img [src]="product.image" class="card-img-top" alt="product">
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">{{product.name}}</h5>
                            <p class="card-text">{{product.description}}</p>
                            
                                <ul class="m-0 p-0 list-unstyled">
                                <li id="Price">Price : <span>{{product.price}}$</span></li>
                                <li id="Quantity">Quantity : <span>0</span></li>
                                <li id="Subtotal">Subtotal : <span>0$</span></li>
                            </ul>

                            <div class="buttons">
                                <button class="btn btn-primary">Add</button>
                                <button class="btn btn-danger">Remove</button>
                            </div>
                        </div>
                    </div>
                </div>
                }
            </div>

            <!-- <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div> -->

        </div>
    </div>
</div>
